<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Your custom CSS for the background gradient -->
    <link rel="stylesheet" href="./style.css">
</head>
<!-- Center everything on the screen vertically and horizontally -->
<body class="d-flex align-items-center justify-content-center vh-100">

    <!-- The Card Container -->
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 16px; border: none;">
        <div class="card-body text-center">
            
            <h2 class="card-title fw-bold mb-4 text-body-emphasis">Get In Touch</h2>
            
            <!-- Phone Section -->
            <div class="mb-3">
                <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem; letter-spacing: 1px;">Phone</p>
                <p class="fs-5 fw-medium mb-0">xx12xx7890</p>
            </div>
            
            <!-- Email Section -->
            <div class="mb-4">
                <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem; letter-spacing: 1px;">Email</p>
                <!-- Made the email clickable -->
                <a href="mailto:xxabxxxxx1@gmail.com" class="text-decoration-none fs-5 fw-medium">xxabxxxxx1@gmail.com</a>
            </div>
            
            <hr class="text-muted my-4">
            
            <!-- Social Buttons -->
            <div class="d-flex justify-content-center gap-3 mb-4">
                <a href="https://www.linkedin.com/feed/" class="btn btn-primary px-4 rounded-pill fw-medium" target="_blank">LinkedIn</a>
                <a href="https://github.com/" class="btn btn-dark px-4 rounded-pill fw-medium" target="_blank">GitHub</a>
            </div>

            <!-- Back to Home Link -->
            <a href="./index.html" class="text-muted text-decoration-none fst-italic" style="font-size: 0.9rem;">
                ← Back to Portfolio
            </a>
            
        </div>
    </div>

</body>
</html>
